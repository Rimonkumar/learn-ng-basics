<div
  class="register-container"
  style="
    max-width: 400px;
    margin: 20px auto;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    background: white;
  "
>
  <h2 style="color: #1e293b; margin-bottom: 20px">Register (Reactive)</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 16px">
      <label style="display: block; margin-bottom: 4px; font-weight: 500">Name:</label>
      <input
        type="text"
        formControlName="name"
        style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px"
      />
      <div
        *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched"
        style="color: #ef4444; font-size: 13px; margin-top: 4px"
      >
        Name is required.
      </div>
    </div>

    <div style="margin-bottom: 16px">
      <label style="display: block; margin-bottom: 4px; font-weight: 500">Email:</label>
      <input
        type="email"
        formControlName="email"
        style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px"
      />
      <div
        *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
        style="color: #ef4444; font-size: 13px; margin-top: 4px"
      >
        Valid email is required.
      </div>
    </div>

    <div style="margin-bottom: 16px">
      <label style="display: block; margin-bottom: 4px; font-weight: 500">Password:</label>
      <input
        type="password"
        formControlName="password"
        style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px"
      />
      <div
        *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
        style="color: #ef4444; font-size: 13px; margin-top: 4px"
      >
        Password min 6 chars.
      </div>
    </div>

    <button
      type="submit"
      [disabled]="registerForm.invalid"
      style="
        width: 100%;
        padding: 12px;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      "
    >
      Register
    </button>
  </form>
</div>
